minimum_pre_commit_version: "4.0.0"
default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=1024
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: catalog-validate
        name: Validate AI asset catalog
        entry: make validate
        language: system
        pass_filenames: false
        stages:
          - pre-commit
      - id: prettier
        name: Check repository formatting
        entry: make format-check
        language: system
        pass_filenames: false
        stages:
          - pre-commit
      - id: markdownlint
        name: Check Markdown structure and style
        entry: make markdown
        language: system
        pass_filenames: false
        stages:
          - pre-commit
      - id: typos
        name: Check repository spelling
        entry: ./scripts/ci/check-typos
        language: system
        pass_filenames: false
        stages:
          - pre-commit
      - id: links-local
        name: Check local Markdown links
        entry: ./scripts/ci/check-links --offline
        language: system
        pass_filenames: false
        stages:
          - pre-commit
      - id: repository-check
        name: Run complete repository checks
        entry: make check
        language: system
        pass_filenames: false
        stages:
          - pre-push
      - id: links-external
        name: Check local and external Markdown links
        entry: ./scripts/ci/check-links
        language: system
        pass_filenames: false
        stages:
          - pre-push
